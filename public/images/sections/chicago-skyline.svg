<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Chicago skyline illustration">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#41b6e6" stop-opacity=".16"/><stop offset="100%" stop-color="#41b6e6" stop-opacity="0"/></linearGradient>
    <linearGradient id="bld" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#173733"/><stop offset="100%" stop-color="#0a1917"/></linearGradient>
    <linearGradient id="gT" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#6ee7b7"/><stop offset="100%" stop-color="#41b6e6"/></linearGradient>
    <path id="star6" d="M0-12 2.5-4.33 10.39-6 5 0l5.39 6-7.89-1.67L0 12l-2.5-7.67L-10.39 6-5 0l-5.39-6 7.89 1.67z"/>
  </defs>
  <rect width="1200" height="420" fill="none"/>
  <rect width="1200" height="300" fill="url(#sky)"/>
  <!-- four flag stars -->
  <g fill="#e4002b">
    <use href="#star6" transform="translate(480 64) scale(1.3)"/>
    <use href="#star6" transform="translate(560 64) scale(1.3)"/>
    <use href="#star6" transform="translate(640 64) scale(1.3)"/>
    <use href="#star6" transform="translate(720 64) scale(1.3)"/>
  </g>
  <!-- skyline: back row -->
  <g fill="url(#bld)" opacity=".55">
    <rect x="40" y="200" width="70" height="220"/>
    <rect x="150" y="170" width="60" height="250"/>
    <rect x="330" y="210" width="80" height="210"/>
    <rect x="560" y="190" width="66" height="230"/>
    <rect x="700" y="220" width="90" height="200"/>
    <rect x="940" y="200" width="70" height="220"/>
    <rect x="1100" y="230" width="70" height="190"/>
  </g>
  <!-- skyline: front row (recognizable silhouettes) -->
  <g fill="url(#bld)" stroke="#41b6e6" stroke-opacity=".5" stroke-width="2">
    <!-- Willis Tower -->
    <g>
      <rect x="230" y="120" width="70" height="300"/>
      <rect x="245" y="90" width="40" height="34"/>
      <line x1="252" y1="90" x2="252" y2="34"/>
      <line x1="278" y1="90" x2="278" y2="34"/>
    </g>
    <!-- Marina City corncobs -->
    <g>
      <path d="M430 420V240a35 35 0 0 1 70 0v180z"/>
      <path d="M520 420V240a35 35 0 0 1 70 0v180z"/>
    </g>
    <!-- Hancock -->
    <g>
      <path d="M650 420V160l25-20 25 20v260z"/>
      <line x1="662" y1="140" x2="662" y2="86"/>
      <line x1="688" y1="140" x2="688" y2="86"/>
      <line x1="650" y1="220" x2="700" y2="200"/>
      <line x1="650" y1="300" x2="700" y2="280"/>
    </g>
    <!-- Aqua-ish tower -->
    <g>
      <rect x="820" y="150" width="80" height="270"/>
      <path d="M820 190q40 14 80 0M820 250q40 14 80 0M820 310q40 14 80 0" fill="none"/>
    </g>
    <!-- Tribune-ish -->
    <path d="M1020 420V240h16v-30h14v-24h12v24h14v30h16v180z"/>
  </g>
  <!-- lake line -->
  <path d="M0 419h1200" stroke="url(#gT)" stroke-width="2.5" opacity=".7"/>
  <!-- window lights -->
  <g fill="#6ee7b7" opacity=".8">
    <rect x="246" y="150" width="8" height="8"/><rect x="270" y="190" width="8" height="8"/><rect x="252" y="260" width="8" height="8"/>
    <rect x="662" y="200" width="7" height="7"/><rect x="680" y="260" width="7" height="7"/>
    <rect x="846" y="210" width="8" height="8"/><rect x="868" y="280" width="8" height="8"/>
  </g>
</svg>
