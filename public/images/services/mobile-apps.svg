<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Mobile apps illustration">
  <defs>
    <radialGradient id="gA" cx="25%" cy="20%" r="60%"><stop offset="0%" stop-color="#34d399" stop-opacity=".28"/><stop offset="100%" stop-color="#34d399" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB" cx="85%" cy="80%" r="55%"><stop offset="0%" stop-color="#41b6e6" stop-opacity=".22"/><stop offset="100%" stop-color="#41b6e6" stop-opacity="0"/></radialGradient>
    <linearGradient id="gT" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6ee7b7"/><stop offset="100%" stop-color="#41b6e6"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/></pattern>
    <path id="star" d="M0-12 2.5-4.33 10.39-6 5 0l5.39 6-7.89-1.67L0 12l-2.5-7.67L-10.39 6-5 0l-5.39-6 7.89 1.67z"/>
  </defs>
  <rect width="800" height="560" rx="24" fill="#0a1917"/>
  <rect width="800" height="560" rx="24" fill="url(#gA)"/>
  <rect width="800" height="560" rx="24" fill="url(#gB)"/>
  <rect width="800" height="560" rx="24" fill="url(#grid)"/>
  <rect width="799" height="559" x=".5" y=".5" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
  <!-- phone -->
  <g transform="translate(300 70)">
    <rect width="200" height="420" rx="34" fill="#0d211f" stroke="url(#gT)" stroke-width="3"/>
    <rect x="70" y="14" width="60" height="10" rx="5" fill="#ffffff" opacity=".15"/>
    <rect x="22" y="44" width="156" height="70" rx="14" fill="#34d399" opacity=".9"/>
    <rect x="38" y="66" width="80" height="10" rx="5" fill="#04100f" opacity=".6"/>
    <rect x="38" y="84" width="56" height="8" rx="4" fill="#04100f" opacity=".4"/>
    <rect x="22" y="128" width="72" height="72" rx="14" fill="#ffffff" opacity=".08"/>
    <rect x="106" y="128" width="72" height="72" rx="14" fill="#41b6e6" opacity=".8"/>
    <rect x="22" y="214" width="72" height="72" rx="14" fill="#41b6e6" opacity=".35"/>
    <rect x="106" y="214" width="72" height="72" rx="14" fill="#ffffff" opacity=".08"/>
    <rect x="22" y="310" width="156" height="44" rx="22" fill="#34d399"/>
    <rect x="70" y="392" width="60" height="6" rx="3" fill="#ffffff" opacity=".3"/>
  </g>
  <!-- notification -->
  <g transform="translate(520 120)">
    <circle r="26" fill="#e4002b"/>
    <use href="#star" transform="scale(1.2)" fill="#ffffff"/>
  </g>
  <!-- signal waves -->
  <g fill="none" stroke="#41b6e6" stroke-width="3" opacity=".55">
    <path d="M180 240a90 90 0 0 1 0 120"/>
    <path d="M150 210a130 130 0 0 1 0 180"/>
  </g>
  <g fill="none" stroke="#6ee7b7" stroke-width="3" opacity=".55">
    <path d="M620 240a90 90 0 0 0 0 120"/>
    <path d="M650 210a130 130 0 0 0 0 180"/>
  </g>
