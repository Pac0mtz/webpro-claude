<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Google Ads illustration">
  <defs>
    <radialGradient id="gA" cx="25%" cy="20%" r="60%"><stop offset="0%" stop-color="#34d399" stop-opacity=".28"/><stop offset="100%" stop-color="#34d399" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB" cx="85%" cy="80%" r="55%"><stop offset="0%" stop-color="#41b6e6" stop-opacity=".22"/><stop offset="100%" stop-color="#41b6e6" stop-opacity="0"/></radialGradient>
    <linearGradient id="gT" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6ee7b7"/><stop offset="100%" stop-color="#41b6e6"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/></pattern>
    <path id="star" d="M0-12 2.5-4.33 10.39-6 5 0l5.39 6-7.89-1.67L0 12l-2.5-7.67L-10.39 6-5 0l-5.39-6 7.89 1.67z"/>
  </defs>
  <rect width="800" height="560" rx="24" fill="#0a1917"/>
  <rect width="800" height="560" rx="24" fill="url(#gA)"/>
  <rect width="800" height="560" rx="24" fill="url(#gB)"/>
  <rect width="800" height="560" rx="24" fill="url(#grid)"/>
  <rect width="799" height="559" x=".5" y=".5" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
  <!-- target -->
  <g transform="translate(310 250)">
    <circle r="150" fill="none" stroke="#41b6e6" stroke-width="3" opacity=".4"/>
    <circle r="105" fill="none" stroke="#41b6e6" stroke-width="3" opacity=".6"/>
    <circle r="60" fill="none" stroke="#6ee7b7" stroke-width="3" opacity=".85"/>
    <circle r="20" fill="#e4002b"/>
  </g>
  <!-- click cursor -->
  <g transform="translate(430 330)">
    <path d="M0 0l16 44 10-18 20 18 12-12-20-18 20-8z" fill="#f6f8f7"/>
  </g>
  <!-- search result card -->
  <g transform="translate(470 90)">
    <rect width="240" height="120" rx="14" fill="#0d211f" stroke="url(#gT)" stroke-width="2.5"/>
    <rect x="20" y="22" width="44" height="20" rx="10" fill="#34d399"/>
    <text x="42" y="37" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#04100f">AD</text>
    <rect x="76" y="24" width="130" height="14" rx="7" fill="#ffffff" opacity=".3"/>
    <rect x="20" y="58" width="190" height="10" rx="5" fill="#ffffff" opacity=".18"/>
    <rect x="20" y="78" width="150" height="10" rx="5" fill="#ffffff" opacity=".12"/>
  </g>
  <!-- coins -->
  <g transform="translate(150 420)">
    <ellipse cx="0" cy="26" rx="34" ry="12" fill="#34d399" opacity=".35"/>
    <ellipse cx="0" cy="14" rx="34" ry="12" fill="#34d399" opacity=".6"/>
    <ellipse rx="34" ry="12" fill="#6ee7b7"/>
    <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#04100f">$</text>
  </g>
  <use href="#star" transform="translate(120 110) scale(1.5)" fill="#e4002b"/>
</svg>
