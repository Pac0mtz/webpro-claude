<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Web design illustration">
  <defs>
    <radialGradient id="gA" cx="25%" cy="20%" r="60%"><stop offset="0%" stop-color="#34d399" stop-opacity=".28"/><stop offset="100%" stop-color="#34d399" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB" cx="85%" cy="80%" r="55%"><stop offset="0%" stop-color="#41b6e6" stop-opacity=".22"/><stop offset="100%" stop-color="#41b6e6" stop-opacity="0"/></radialGradient>
    <linearGradient id="gT" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6ee7b7"/><stop offset="100%" stop-color="#41b6e6"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/></pattern>
    <path id="star" d="M0-12 2.5-4.33 10.39-6 5 0l5.39 6-7.89-1.67L0 12l-2.5-7.67L-10.39 6-5 0l-5.39-6 7.89 1.67z"/>
  </defs>
  <rect width="800" height="560" rx="24" fill="#0a1917"/>
  <rect width="800" height="560" rx="24" fill="url(#gA)"/>
  <rect width="800" height="560" rx="24" fill="url(#gB)"/>
  <rect width="800" height="560" rx="24" fill="url(#grid)"/>
  <rect width="799" height="559" x=".5" y=".5" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
  <!-- browser frame -->
  <g transform="translate(150 110)">
    <rect width="500" height="340" rx="16" fill="#0d211f" stroke="url(#gT)" stroke-width="2.5"/>
    <line x1="0" y1="52" x2="500" y2="52" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
    <circle cx="30" cy="26" r="7" fill="#e4002b" opacity=".8"/><circle cx="56" cy="26" r="7" fill="#ffffff" opacity=".18"/><circle cx="82" cy="26" r="7" fill="#ffffff" opacity=".18"/>
    <rect x="150" y="16" width="200" height="20" rx="10" fill="#ffffff" opacity=".08"/>
    <!-- wireframe -->
    <rect x="40" y="90" width="180" height="26" rx="8" fill="#6ee7b7" opacity=".85"/>
    <rect x="40" y="132" width="240" height="12" rx="6" fill="#ffffff" opacity=".25"/>
    <rect x="40" y="156" width="200" height="12" rx="6" fill="#ffffff" opacity=".18"/>
    <rect x="40" y="196" width="110" height="36" rx="18" fill="#34d399"/>
    <rect x="320" y="90" width="140" height="142" rx="12" fill="none" stroke="#41b6e6" stroke-width="2.5" stroke-dasharray="7 7"/>
    <use href="#star" transform="translate(390 161) scale(1.6)" fill="#e4002b"/>
    <rect x="40" y="262" width="128" height="52" rx="10" fill="#ffffff" opacity=".07"/>
    <rect x="186" y="262" width="128" height="52" rx="10" fill="#ffffff" opacity=".07"/>
    <rect x="332" y="262" width="128" height="52" rx="10" fill="#ffffff" opacity=".07"/>
  </g>
  <!-- pen cursor -->
  <g transform="translate(620 400) rotate(-18)">
    <path d="M0 0l14 34-6 22-16-14z" fill="url(#gT)"/>
  </g>
  <!-- swatches -->
  <g transform="translate(96 388)">
    <circle r="16" fill="#34d399"/><circle cx="40" r="16" fill="#41b6e6"/><circle cx="80" r="16" fill="#e4002b"/>
  </g>
</svg>
