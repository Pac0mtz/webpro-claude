<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Site maintenance illustration">
  <defs>
    <radialGradient id="gA" cx="25%" cy="20%" r="60%"><stop offset="0%" stop-color="#34d399" stop-opacity=".28"/><stop offset="100%" stop-color="#34d399" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB" cx="85%" cy="80%" r="55%"><stop offset="0%" stop-color="#41b6e6" stop-opacity=".22"/><stop offset="100%" stop-color="#41b6e6" stop-opacity="0"/></radialGradient>
    <linearGradient id="gT" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6ee7b7"/><stop offset="100%" stop-color="#41b6e6"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/></pattern>
    <path id="star" d="M0-12 2.5-4.33 10.39-6 5 0l5.39 6-7.89-1.67L0 12l-2.5-7.67L-10.39 6-5 0l-5.39-6 7.89 1.67z"/>
  </defs>
  <rect width="800" height="560" rx="24" fill="#0a1917"/>
  <rect width="800" height="560" rx="24" fill="url(#gA)"/>
  <rect width="800" height="560" rx="24" fill="url(#gB)"/>
  <rect width="800" height="560" rx="24" fill="url(#grid)"/>
  <rect width="799" height="559" x=".5" y=".5" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
  <!-- shield -->
  <g transform="translate(400 250)">
    <path d="M0-150c50 34 104 44 140 46 0 118-52 196-140 240-88-44-140-122-140-240 36-2 90-12 140-46z" fill="#0d211f" stroke="url(#gT)" stroke-width="4"/>
    <path d="M-58 6l38 40 82-88" fill="none" stroke="#34d399" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- wrench -->
  <g transform="translate(590 380) rotate(38)">
    <path d="M-14-72a44 44 0 0 1 58 46l-8 8-26-6-6-26 8-8a44 44 0 0 0-26-14z" fill="#41b6e6" opacity=".9"/>
    <rect x="-10" y="-30" width="24" height="110" rx="12" fill="#41b6e6" opacity=".9"/>
  </g>
  <!-- uptime pulse -->
  <g transform="translate(90 470)">
    <path d="M0 0h130l22-44 32 76 26-32h150" fill="none" stroke="#6ee7b7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="360" r="8" fill="#34d399">
      <animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <use href="#star" transform="translate(140 100) scale(1.5)" fill="#e4002b"/>
  <!-- 24/7 badge -->
  <g transform="translate(660 110)">
    <circle r="42" fill="#0d211f" stroke="#34d399" stroke-width="3"/>
    <text y="7" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#6ee7b7">24/7</text>
  </g>
</svg>
